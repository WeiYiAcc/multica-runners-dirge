# SecretSpec manifest — dirge trimmed multica runner
# 声明 dirge 需要的 secrets；实际值由 dotenv provider 提供（api-keys.env）
# 用法：
#   secretspec check   # 校验所有 secret 可解析
#   secretspec run -- dirge ...   # 注入环境变量后执行

[project]
name = "dirge-multica-trimmed"
revision = "1.0"

[profiles.default]
OPENROUTER_API_KEY = { description = "OpenRouter API key (free tier)", required = true }
